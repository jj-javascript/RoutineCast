name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # E2E stitch test needs real ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      - run: npm run build -w @routinecast/shared
      - run: npm run typecheck
      - run: npm test
